<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marissa's Voice header</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 100%; background: #FFFFFF; font-family: 'Open Sans', sans-serif; border-bottom: 3px solid #D4A017">
<div style="background: #461078; color: #FFFFFF; padding: 8px 24px; text-align: center; font-size: 14px; font-weight: 600; line-height: 1.4">In an emergency, call 911. &nbsp;Struggling? Call or text 988.</div>
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<a href="Main.dc.html" aria-label="Marissa's Voice home" style="display: flex; align-items: center; gap: 14px; color: #461078">
<span style="display: block; width: 68px; height: 68px; border-radius: 50%; background: #FFFFFF; padding: 3px; box-sizing: border-box; border: 1px solid #E4DAF3; flex-shrink: 0"><img src="./assets/8c5df0728a7719428752ab17da5228ed.png" alt="Marissa's Voice official round logo" style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF"></span>
<span style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; color: #461078">Marissa’s Voice</span><span style="font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.12em; color: #006F73; text-transform: uppercase">Forever 21</span></span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; flex: 1 1 520px; justify-content: center">
<sc-for list="{{links}}" as="item" hint-placeholder-count="6">
<a href="{{item.href}}" style="{{item.style}}">{{item.label}}</a>
</sc-for>
</nav>
<a href="Involved.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 26px; background: #6A0DAD; color: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; border-radius: 999px">Donate</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","story","finder","book","outreach","involved","contact"]},"$preview":{"width":1360,"height":124}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const base = "display: inline-flex; align-items: center; min-height: 44px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 14px; padding: 0 2px; box-sizing: border-box; ";
const on = base + 'color: #461078; border-bottom: 3px solid #D4A017;';
const off = base + 'color: #28232D; border-bottom: 3px solid transparent;';
const defs = [
['home', 'Home', 'Main.dc.html'],
['story', 'Marissa’s Story', 'biography.html'],
['finder', 'Find Naloxone', 'https://marissas-voice-naloxone-finder.netlify.app/'],
['book', 'The Book', 'poetry.html'],
['outreach', 'Education', 'blog.html'],
['involved', 'Get Involved', 'share.html'],
['contact', 'Contact', 'contact.html']
];
return { links: defs.map(([k, label, href]) => ({ label, href, style: k === active ? on : off })) };
}
}
</script>
</body>
</html>
